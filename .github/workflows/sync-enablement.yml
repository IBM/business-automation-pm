name: Sync Enablement data from Monday.com

on:
  schedule:
    - cron: '0 11 * * 1-5' # weekdays at 11:00 UTC
  workflow_dispatch:

permissions:
  contents: write # commit src/enablement.json
  actions: write # dispatch the Pages deploy (pushes made with GITHUB_TOKEN do not trigger it)

concurrency:
  group: sync-enablement
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch board data
        run: node scripts/sync-enablement.mjs
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
      - name: Commit changes and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/enablement.json; then
            echo "Board data unchanged; nothing to deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/enablement.json
          git commit -m "chore: sync enablement data from Monday.com"
          git push
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
